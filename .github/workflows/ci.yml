name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: syntax
        run: python -m py_compile watcher.py fbn_patch.py braveduck_service.py
      - name: braveduck service tests
        run: python -m unittest test_braveduck_service -v
      - name: image
        run: docker build -t fb-watcher .
