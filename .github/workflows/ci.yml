name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: syntax
        run: python -m py_compile watcher.py fbn_patch.py braveduck_service.py fetch_post.py
      - name: braveduck service tests
        run: python -m unittest test_braveduck_service -v
      - name: install fbn and Chromium
        run: pip install -r requirements.txt && python -m playwright install --with-deps chromium
      - name: run loop tests (no Facebook)
        run: python tests/test_run_loop.py
      - name: fetch-post tests (no Facebook)
        run: python tests/test_fetch_post.py
      - name: image
        run: docker build -t fb-watcher .
